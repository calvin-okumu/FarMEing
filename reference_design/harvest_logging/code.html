<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>The Tactile Earth - Harvest Log</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary-fixed-dim": "#ebbcac",
                        "on-error": "#ffffff",
                        "on-primary-fixed": "#002204",
                        "tertiary-fixed": "#ffdad6",
                        "surface-container-highest": "#e4e2e0",
                        "inverse-surface": "#30302f",
                        "inverse-primary": "#88d982",
                        "surface-container-high": "#eae8e6",
                        "surface": "#fbf9f7",
                        "on-surface": "#1b1c1b",
                        "secondary-fixed": "#ffdbcf",
                        "error": "#ba1a1a",
                        "outline": "#717a6d",
                        "on-secondary-fixed": "#2e150b",
                        "tertiary-container": "#a60a15",
                        "on-tertiary-fixed": "#410003",
                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#1b6d24",
                        "on-secondary-container": "#795548",
                        "tertiary": "#7c000a",
                        "on-surface-variant": "#41493e",
                        "on-tertiary-fixed-variant": "#93000e",
                        "on-primary-fixed-variant": "#005312",
                        "on-primary-container": "#86d881",
                        "outline-variant": "#c0c9bb",
                        "primary-fixed": "#a3f69c",
                        "on-secondary-fixed-variant": "#603f33",
                        "tertiary-fixed-dim": "#ffb4ac",
                        "surface-variant": "#e4e2e0",
                        "primary": "#00450d",
                        "surface-container-low": "#f5f3f1",
                        "surface-bright": "#fbf9f7",
                        "primary-fixed-dim": "#88d982",
                        "background": "#fbf9f7",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#f2f0ee",
                        "on-tertiary-container": "#ffb2aa",
                        "surface-container": "#efedec",
                        "primary-container": "#065f18",
                        "surface-dim": "#dbdad8",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "secondary": "#7a5649",
                        "error-container": "#ffdad6",
                        "on-background": "#1b1c1b",
                        "secondary-container": "#fdcdbc"
                    },
                    fontFamily: {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fbf9f7;
        }
        h1, h2, h3 {
            font-family: 'Manrope', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen pb-32">
<!-- TopAppBar -->
<header class="sticky top-0 z-50 bg-[#f5f3f1] dark:bg-stone-900 flex justify-between items-center w-full px-6 py-4">
<div class="flex items-center gap-4">
<button class="p-2 rounded-full hover:bg-[#efedec] transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined text-[#00450d]" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-manrope font-bold text-2xl text-[#00450d]">Harvest Log</h1>
</div>
<div class="flex items-center gap-2">
<span class="text-on-surface-variant font-medium text-sm">EN / SW</span>
<button class="p-2 rounded-full hover:bg-[#efedec] transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined text-[#00450d]" data-icon="translate">translate</span>
</button>
</div>
</header>
<main class="max-w-xl mx-auto px-6 py-8">
<!-- Sub-header Editorial -->
<div class="mb-10 text-left">
<h2 class="text-headline font-extrabold text-3xl text-primary tracking-tight leading-none mb-2">Kumbukumbu za Mavuno</h2>
<p class="text-body text-on-surface-variant font-medium">Record your daily yield to track farm productivity and growth.</p>
</div>
<form class="space-y-8">
<!-- Crop Selection Bento Piece -->
<section class="space-y-3">
<label class="font-headline font-bold text-lg text-primary flex items-center gap-2">
<span class="material-symbols-outlined" data-icon="agriculture">agriculture</span>
                    Crop Type / Aina ya Zao
                </label>
<div class="relative group">
<select class="w-full h-16 px-6 bg-surface-container-highest border-none rounded-lg text-on-surface font-semibold focus:ring-2 focus:ring-primary-fixed transition-all appearance-none">
<option>Maize (Mahindi)</option>
<option>Beans (Maharage)</option>
<option>Coffee (Kahawa)</option>
<option>Tea (Chai)</option>
<option>Tomatoes (Nyanya)</option>
</select>
<div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="expand_more">expand_more</span>
</div>
</div>
</section>
<!-- Quantity Asymmetric Layout -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-6 items-end">
<div class="space-y-3">
<label class="font-headline font-bold text-lg text-primary flex items-center gap-2">
<span class="material-symbols-outlined" data-icon="scale">scale</span>
                        Quantity (kg) / Kiasi (kg)
                    </label>
<input class="w-full h-20 px-6 bg-surface-container-highest border-none rounded-lg text-3xl font-black text-primary focus:ring-2 focus:ring-primary-fixed transition-all placeholder:text-outline-variant" placeholder="0.00" type="number"/>
</div>
<div class="bg-primary-container p-6 rounded-lg text-on-primary-container h-20 flex items-center justify-between">
<span class="text-sm font-bold uppercase tracking-widest">Live Total</span>
<span class="text-2xl font-black">2.4 Tons</span>
</div>
</section>
<!-- Quality Grade Toggle Chips -->
<section class="space-y-4">
<label class="font-headline font-bold text-lg text-primary flex items-center gap-2">
<span class="material-symbols-outlined" data-icon="verified">verified</span>
                    Quality Grade / Ubora
                </label>
<div class="flex flex-wrap gap-3">
<button class="flex-1 min-w-[100px] h-20 rounded-lg bg-primary-fixed text-on-primary-fixed flex flex-col items-center justify-center transition-all active:scale-95 border-b-4 border-primary/20" type="button">
<span class="font-black text-xl">Grade A</span>
<span class="text-[10px] font-bold uppercase tracking-tighter">Premium</span>
</button>
<button class="flex-1 min-w-[100px] h-20 rounded-lg bg-surface-container-high text-on-surface-variant flex flex-col items-center justify-center hover:bg-surface-container-highest transition-all active:scale-95" type="button">
<span class="font-black text-xl">Grade B</span>
<span class="text-[10px] font-bold uppercase tracking-tighter">Standard</span>
</button>
<button class="flex-1 min-w-[100px] h-20 rounded-lg bg-surface-container-high text-on-surface-variant flex flex-col items-center justify-center hover:bg-surface-container-highest transition-all active:scale-95" type="button">
<span class="font-black text-xl">Grade C</span>
<span class="text-[10px] font-bold uppercase tracking-tighter">Processing</span>
</button>
</div>
</section>
<!-- Date Selection -->
<section class="space-y-3">
<label class="font-headline font-bold text-lg text-primary flex items-center gap-2">
<span class="material-symbols-outlined" data-icon="calendar_today">calendar_today</span>
                    Harvest Date / Tarehe
                </label>
<div class="relative">
<input class="w-full h-16 px-6 bg-surface-container-highest border-none rounded-lg text-on-surface font-semibold focus:ring-2 focus:ring-primary-fixed transition-all" type="date" value="2023-10-27"/>
</div>
</section>
<!-- Notes / Editorial Text -->
<section class="p-6 bg-surface-container-low rounded-lg space-y-3">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary-container text-sm" data-icon="history_edu">history_edu</span>
</div>
<span class="font-bold text-primary">Field Notes</span>
</div>
<textarea class="w-full bg-transparent border-none p-0 focus:ring-0 text-on-surface resize-none placeholder:text-outline italic" placeholder="Maelezo ya ziada kuhusu mavuno ya leo..." rows="3"></textarea>
</section>
<!-- Submit Action -->
<div class="pt-4">
<button class="w-full h-16 bg-primary-fixed text-on-primary-fixed font-headline font-extrabold text-xl rounded-lg shadow-xl shadow-primary-fixed/20 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-3" type="submit">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
                    Log Harvest / Hifadhi Mavuno
                </button>
<p class="text-center mt-4 text-xs font-medium text-outline uppercase tracking-widest">Last logged 4 hours ago by Shamba Lead</p>
</div>
</form>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-white/80 dark:bg-stone-900/80 backdrop-blur-md shadow-[0_-4px_24px_rgba(27,28,27,0.04)] rounded-t-[32px]">
<a class="flex flex-col items-center justify-center text-[#1b1c1b] dark:text-stone-400 px-5 py-2 hover:text-[#00450d] transition-all" href="#">
<span class="material-symbols-outlined mb-1" data-icon="dashboard">dashboard</span>
<span class="font-inter text-[11px] font-medium tracking-wide">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center text-[#1b1c1b] dark:text-stone-400 px-5 py-2 hover:text-[#00450d] transition-all" href="#">
<span class="material-symbols-outlined mb-1" data-icon="payments">payments</span>
<span class="font-inter text-[11px] font-medium tracking-wide">Expenses</span>
</a>
<a class="flex flex-col items-center justify-center bg-[#a3f69c] dark:bg-[#00450d] text-[#00450d] dark:text-[#a3f69c] rounded-[24px] px-5 py-2 scale-110 duration-300 ease-out" href="#">
<span class="material-symbols-outlined mb-1" data-icon="agriculture" style="font-variation-settings: 'FILL' 1;">agriculture</span>
<span class="font-inter text-[11px] font-medium tracking-wide">Harvest</span>
</a>
<a class="flex flex-col items-center justify-center text-[#1b1c1b] dark:text-stone-400 px-5 py-2 hover:text-[#00450d] transition-all" href="#">
<span class="material-symbols-outlined mb-1" data-icon="group">group</span>
<span class="font-inter text-[11px] font-medium tracking-wide">Workers</span>
</a>
<a class="flex flex-col items-center justify-center text-[#1b1c1b] dark:text-stone-400 px-5 py-2 hover:text-[#00450d] transition-all" href="#">
<span class="material-symbols-outlined mb-1" data-icon="monetization_on">monetization_on</span>
<span class="font-inter text-[11px] font-medium tracking-wide">Sales</span>
</a>
</nav>
</body></html>
